[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agentic-financial-reporting-assignment"
version = "0.1.0"
description = "Manual adjustments validation slice for the AI Agentic Engineer take-home assignment"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0,<2.0"]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
financial-adjustments = "financial_agent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]